<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">GameReviews — Your games. Your verdict.</title>
  <desc id="description">A bold yellow and black GameReviews banner. A rating card displays the zero-to-ten score range. Built for PC, console, and mobile players.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <path fill="#151515" d="M0 0h1280v440H0z"/>
  <path fill="url(#grid)" d="M746 0h534v440H746z"/>
  <path fill="#ffe600" d="M0 0h1280v8H0z"/>

  <g transform="translate(48 35)">
    <path fill="#ffe600" d="M0 0h40v40H0z"/>
    <g fill="none" stroke="#151515" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M12 9h16v10a8 8 0 0 1-16 0V9Zm8 18v6m-6 0h12M12 12H7v6a5 5 0 0 0 6 5m15-11h5v6a5 5 0 0 1-6 5"/>
    </g>
    <text x="55" y="28" fill="#f7f7f5" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="3">GAMEREVIEWS</text>
  </g>
  <text x="1232" y="60" text-anchor="end" fill="#b6b9b0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">BUILT FOR EVERY PLAYER</text>

  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="80" font-weight="900" letter-spacing="-3">
    <text x="43" y="181" fill="#f7f7f5">YOUR GAMES.</text>
    <text x="43" y="269" fill="#ffe600">YOUR VERDICT.</text>
  </g>
  <text x="48" y="316" fill="#b6b9b0" font-family="Arial, Helvetica, sans-serif" font-size="19">Honest reviews. Real conversations. A community that plays.</text>

  <g transform="translate(903 112) rotate(-4 145 111)">
    <path fill="#050606" d="M9 9h282v223H9z"/>
    <path fill="#ffe600" stroke="#f7f7f5" stroke-width="2" d="M0 0h282v223H0z"/>
    <path stroke="#151515" stroke-width="2" d="M0 46h282M0 173h282"/>
    <g font-family="Arial, Helvetica, sans-serif" fill="#151515">
      <text x="18" y="29" font-size="12" font-weight="800" letter-spacing="1.7">THE SCORE IS YOURS</text>
      <text x="141" y="142" text-anchor="middle" font-size="86" font-weight="900" letter-spacing="-5">0–10</text>
      <text x="141" y="202" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.6">ONE GAME. EVERY PERSPECTIVE.</text>
    </g>
    <g stroke="#151515" stroke-width="2.5">
      <path d="M257 17v12m-6-6h12"/>
    </g>
  </g>

  <path stroke="#494e49" d="M48 365h1184"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">
    <text x="48" y="404" fill="#ffe600">PC · CONSOLE · MOBILE</text>
    <text x="1232" y="404" text-anchor="end" fill="#f7f7f5">RATE / REVIEW / DISCUSS</text>
  </g>
</svg>
